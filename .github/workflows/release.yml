# A `v*` tag builds, attests and publishes a release. Everything people
# install comes from this workflow, on this tag:
#   - binaries on the GitHub release, with build provenance attestations
#     (verify: gh attestation verify <file> --repo oakoliver/oak-oil)
#   - the crate on crates.io, published through trusted publishing (OIDC),
#     so no long-lived token exists
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  RUST_VERSION: "1.95.0"
  CARGO_TERM_COLOR: always

jobs:
  # The same checks as CI, on both operating systems, before anything ships.
  verify:
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"

      - name: Tag matches Cargo.toml version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }

      - run: cargo fmt --check
      - run: cargo clippy --locked --release -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: python3 ci/oracle.py target/release/cargo-oil

  # One archive per target, each built on a native runner (the Intel macOS
  # binary is cross-compiled on Apple Silicon). Archives travel to the
  # release job as workflow artifacts; nothing is published here.
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-15, oracle: true }
          - { target: x86_64-apple-darwin, os: macos-15, oracle: false }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, oracle: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, oracle: true }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"

      - run: cargo build --locked --release --target "$TARGET"

      # The binary that ships, checked against stock Cargo where the runner
      # can execute it.
      - name: Oracle on the shipped binary
        if: matrix.oracle
        run: python3 ci/oracle.py "target/$TARGET/release/cargo-oil"

      - name: glibc versions required
        if: runner.os == 'Linux'
        run: objdump -T "target/$TARGET/release/cargo-oil" | grep -o 'GLIBC_[0-9.]*' | sort -uV

      - name: Package
        run: |
          mkdir dist
          name="cargo-oil-$GITHUB_REF_NAME-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/cargo-oil" README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Releases on this repository are immutable: the release is created once,
  # with every asset, after every target has built and every check passed.
  release:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      # gh runs in a checkout of the tag, as it did before artifacts moved
      # between jobs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: All archives present, checksums
        run: |
          cd dist
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            test -f "cargo-oil-$GITHUB_REF_NAME-$target.tar.gz" || { echo "missing $target"; exit 1; }
          done
          test "$(ls | wc -l)" -eq 4 || { ls; echo "unexpected files in dist"; exit 1; }
          sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Built by [this workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) from ${GITHUB_SHA}.

          Verify a download: \`gh attestation verify cargo-oil-${GITHUB_REF_NAME}-<target>.tar.gz --repo ${GITHUB_REPOSITORY}\`"

  crate:
    needs: release
    runs-on: macos-15
    environment: crates-io
    permissions:
      contents: read
      id-token: write      # trusted publishing to crates.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      # Trusted publishing needs the crate to exist on crates.io, so the very
      # first release uses a one-time token stored as the `crates-io`
      # environment secret CARGO_REGISTRY_TOKEN. Once a trusted publisher is
      # configured on crates.io, that secret is deleted and the OIDC step
      # below is used: no long-lived token remains.
      - name: First release?
        id: mode
        env:
          FIRST_PUBLISH_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$FIRST_PUBLISH_TOKEN" ]; then echo "first=true"; else echo "first=false"; fi >> "$GITHUB_OUTPUT"

      - name: crates.io token (OIDC, short-lived)
        id: auth
        if: steps.mode.outputs.first != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        env:
          FIRST_PUBLISH_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          OIDC_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if [ -n "$FIRST_PUBLISH_TOKEN" ]; then
            echo "Publishing with the one-time token (first release)"
            CARGO_REGISTRY_TOKEN="$FIRST_PUBLISH_TOKEN" cargo publish --locked
          else
            echo "Publishing through trusted publishing (OIDC)"
            CARGO_REGISTRY_TOKEN="$OIDC_TOKEN" cargo publish --locked
          fi
