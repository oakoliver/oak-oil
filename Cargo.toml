[package]
name = "oak-oil"
version = "0.1.0"
edition = "2024"
description = "Oak Oil: the WD-40 for Rust builds. A Cargo-compatible build executor and content store, with verified cleanup of build residue."
readme = "README.md"
keywords = ["cargo", "build", "cache", "disk", "executor"]
categories = ["development-tools::cargo-plugins", "development-tools::build-utils"]
license = "MIT OR Apache-2.0"

[[bin]]
name = "cargo-oil"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[dependencies]
libc = "0.2"
blake3 = { version = "1", features = ["mmap"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
