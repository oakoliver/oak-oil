[package]
name = "cargo-oil"
version = "0.2.0"
edition = "2024"
description = "Oak Oil: lean, fast Rust builds. A Cargo-compatible build executor and content store, with verified cleanup of build residue."
readme = "README.md"
keywords = ["cargo", "build", "cache", "disk", "executor"]
categories = ["development-tools::cargo-plugins", "development-tools::build-utils"]
license = "MIT OR Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/oakoliver/oak-oil"
homepage = "https://github.com/oakoliver/oak-oil"
include = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

# `cargo binstall cargo-oil` downloads the binary built and attested by the
# release workflow (see README, "Where releases come from").
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "cargo-oil"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[dependencies]
libc = "0.2"
blake3 = { version = "1", features = ["mmap"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
